name: Publicar sitio
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - id: prep
        run: |
          Z="$(git -c core.quotePath=false diff --name-only --diff-filter=AM HEAD~1 HEAD -- '*.zip' 2>/dev/null | tail -n1)"
          [ -n "$Z" ] || Z="$(ls -1 *.zip 2>/dev/null | sort -V | tail -n1)"
          rm -rf _p
          if [ -f "$Z" ]; then
            echo "Publicando $Z"; unzip -q "$Z" -d _p; rm -rf _p/__MACOSX
            if [ ! -f _p/index.html ]; then d="$(dirname "$(find _p -mindepth 2 -maxdepth 2 -name index.html | head -n1)")"; [ "$d" != . ] && mv "$d" _q && rm -rf _p && mv _q _p; fi
          elif [ -f sitio/index.html ]; then cp -R sitio _p
          else echo "Sin sitio que publicar"; exit 0; fi
          test -f _p/index.html && echo "ok=1" >> "$GITHUB_OUTPUT"
      - if: steps.prep.outputs.ok == '1'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy _p --project-name=betafaunaguardianes --branch=main --commit-dirty=true
